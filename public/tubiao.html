<!DOCTYPE html>
<html lang="zh-CN">

    .header {
      padding: 22px 28px 16px 28px;
      border-bottom: 1px solid #eef2f6;

      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .title-section h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      background: linear-gradient(145deg, #1f3a4b, #2c6280);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.4px;
    }

    .title-section p {
      font-size: 0.85rem;
      color: #5d7184;
      margin: 0;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #f8fafc;
      border: 1px solid #dce5ec;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      color: #1f4662;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn-primary {
      background: #1e4a6b;
      border-color: #1e4a6b;
      color: white;
    }

    .btn-primary:hover {
      background: #0e3852;
      transform: translateY(-1px);
    }

    .btn:hover {
      background: #eef3fc;
      border-color: #cbdde9;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .table-wrapper {
      padding: 0 0 16px 0;
      overflow-x: auto;
    }

    .editable-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 1000px;
    }

    .editable-table th {
      text-align: left;
      padding: 18px 16px;
      background-color: #fafcff;
      font-weight: 600;
      color: #1e4a6b;
      border-bottom: 1px solid #e6edf4;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .editable-table td {
      padding: 15px 16px;
      border-bottom: 1px solid #eff3f8;
      vertical-align: top;
      word-break: break-word;
      background-color: #ffffff;
      transition: background 0.1s;
    }

    .editable-table tr:hover td {
      background-color: #fefbf0;
    }

    [contenteditable="true"] {
      outline: none;
      cursor: text;
      border-radius: 8px;
      padding: 2px 4px;
      transition: background 0.1s, box-shadow 0.1s;
      word-break: break-word;
      white-space: pre-wrap;
    }

    [contenteditable="true"]:focus {
      background-color: #fff6e0;
      box-shadow: 0 0 0 2px rgba(30, 74, 107, 0.15);

      font-weight: 700;
      font-size: 0.95rem;

      padding: 18px 28px 24px;
      border-top: 1px solid #ecf2f8;
      display: flex;
      gap: 16px;
      justify-content: flex-end;
      background: #ffffff;
      flex-wrap: wrap;
    }

    .info-note {
      font-size: 0.7rem;
      color: #6a7f9b;
      margin-right: auto;
      align-self: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 16px;
      }

      .header {
        flex-direction: column;
      }

      .editable-table th,
      .editable-table td {
        padding: 12px 10px;
      }
    }
  </style>
</head>

  // DOM 元素

  // 渲染表格 (所有单元格 contenteditable 并绑定数据同步)
  function renderTable() {
    tbody.innerHTML = '';
    carData.forEach((item, idx) => {
      const row = tbody.insertRow();

      // 车型列
      const cellModel = row.insertCell(0);
      cellModel.setAttribute('contenteditable', 'true');
      cellModel.setAttribute('data-field', 'model');
      cellModel.setAttribute('data-idx', idx);
      cellModel.innerText = item.model || '';
      cellModel.classList.add('model-highlight');

      // 价格列
      const cellPrice = row.insertCell(1);
      cellPrice.setAttribute('contenteditable', 'true');
      cellPrice.setAttribute('data-field', 'price');
      cellPrice.setAttribute('data-idx', idx);
      cellPrice.innerText = item.price || '';

      // 动力/定位列
      const cellPower = row.insertCell(2);
      cellPower.setAttribute('contenteditable', 'true');
      cellPower.setAttribute('data-field', 'powerPosition');
      cellPower.setAttribute('data-idx', idx);
      cellPower.innerText = item.powerPosition || '';

      // 核心配置列
      const cellConfig = row.insertCell(3);
      cellConfig.setAttribute('contenteditable', 'true');
      cellConfig.setAttribute('data-field', 'coreConfig');
      cellConfig.setAttribute('data-idx', idx);
      cellConfig.innerText = item.coreConfig || '';

      // 上市节奏列
      const cellSchedule = row.insertCell(4);
      cellSchedule.setAttribute('contenteditable', 'true');
      cellSchedule.setAttribute('data-field', 'schedule');
      cellSchedule.setAttribute('data-idx', idx);
      cellSchedule.innerText = item.schedule || '';

      // 绑定失焦事件更新内存数据
      const updateData = (e, field) => {
        const newVal = e.target.innerText.trim();
        const index = parseInt(e.target.getAttribute('data-idx'));
        if (!isNaN(index) && carData[index]) {
          carData[index][field] = newVal;
        }
      };

      cellModel.addEventListener('blur', (e) => updateData(e, 'model'));
      cellPrice.addEventListener('blur', (e) => updateData(e, 'price'));
      cellPower.addEventListener('blur', (e) => updateData(e, 'powerPosition'));
      cellConfig.addEventListener('blur', (e) => updateData(e, 'coreConfig'));
      cellSchedule.addEventListener('blur', (e) => updateData(e, 'schedule'));
    });
  }

  // 导出 JSON
  function exportJSON() {
    const dataStr = JSON.stringify(carData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'competitor_cars_2026.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // 导出 CSV (UTF-8 with BOM)
  function exportCSV() {
    const headers = ['车型名称', '预测价格区间', '动力形式/定位', '核心配置/技术亮点', '发布/上市节奏'];
    const rows = carData.map(item => [
      item.model,
      item.price,
      item.powerPosition,
      item.coreConfig,
      item.schedule
    ]);
    const csvLines = [];
    csvLines.push(headers.map(cell => `"${cell.replace(/"/g, '""')}"`).join(','));
    for (const row of rows) {
      const escapedRow = row.map(cell => {
        if (cell === undefined || cell === null) return '""';
        const str = String(cell);
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      }).join(',');
      csvLines.push(escapedRow);
    }
    const csvContent = csvLines.join('\n');
    const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute('download', 'competitor_plan_2026.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // 复制表格快照（带基本样式、无contenteditable属性）
  async function copyTableSnapshot() {
    const tableElem = document.getElementById('mainTable');
    const cloneTable = tableElem.cloneNode(true);
    // 移除编辑属性，让复制的内容更整洁
    cloneTable.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.removeAttribute('contenteditable');
      el.style.backgroundColor = 'transparent';
      el.style.boxShadow = 'none';
    });
    // 克隆后的表格转成html字符串
    const htmlContent = cloneTable.outerHTML;
    const plainText = carData.map(c => `${c.model} | ${c.price} | ${c.powerPosition} | ${c.coreConfig.substring(0, 80)}... | ${c.schedule}`).join('\n');
    try {
      const clipboardItem = new ClipboardItem({
        'text/html': new Blob([htmlContent], { type: 'text/html' }),
        'text/plain': new Blob([plainText], { type: 'text/plain' })
      });
      await navigator.clipboard.write([clipboardItem]);
      alert('✅ 表格快照已复制 (含富文本格式)，可粘贴到Word、邮件或支持HTML的编辑器中');
    } catch (err) {
      // fallback
      const textarea = document.createElement('textarea');
      textarea.value = plainText;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert('⚠️ 已复制纯文本版本，完整表格快照可尝试手动导出CSV');
    }
  }

    if (copyBtn) copyBtn.addEventListener('click', copyTableSnapshot);
